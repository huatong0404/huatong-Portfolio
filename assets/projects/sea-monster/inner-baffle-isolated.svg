<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="188" height="410" viewBox="88 276 188 410" role="img" aria-labelledby="title description">
  <title id="title">One ventilated fabric baffle from the Sea Monster head</title>
  <desc id="description">The original angled fabric wall has three equal elliptical openings representing circular vents seen obliquely. Together the openings occupy 40 percent of the pictured wall. Three fine arrows enter from the left, pass through the holes and across the narrow fabric bridges, then leave on the right.</desc>
  <defs>
    <!-- Three equal vents: each pi × 32.71851248 × 46.27096409; together 40% of the original baffle path. -->
    <mask id="baffle-vent-mask" x="88" y="276" width="188" height="410" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" style="mask-type:luminance">
      <rect x="88" y="276" width="188" height="410" fill="white"/>
      <ellipse cx="215" cy="405" rx="32.71851248" ry="46.27096409" fill="black"/>
      <ellipse cx="180" cy="495" rx="32.71851248" ry="46.27096409" fill="black"/>
      <ellipse cx="142" cy="585" rx="32.71851248" ry="46.27096409" fill="black"/>
    </mask>
    <clipPath id="airflow-exit-bridges" clipPathUnits="userSpaceOnUse">
      <rect x="243" y="378" width="26" height="64"/>
      <rect x="208" y="468" width="55" height="65"/>
      <rect x="169" y="558" width="73" height="70"/>
    </clipPath>
    <marker id="air-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#1F6D79" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- The full arrows sit behind the wall, so the openings reveal the through-flow. -->
  <g id="airflow" fill="none" stroke="#1F6D79" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity=".9" aria-hidden="true">
    <path id="upper-airflow" d="M94 383 Q103.9 393.3 113.8 387.7 Q123.7 382 133.6 392.3 Q143.4 402.7 153.3 397 Q163.2 391.3 173.1 401.7 Q183 412 192.9 406.3 Q202.8 400.7 212.7 411 Q222.6 421.3 232.4 415.7 Q242.3 410 252.2 420.3 Q262.1 430.7 272 425" marker-end="url(#air-arrow)"/>
    <path id="middle-airflow" d="M92 470 Q102.1 480.9 112.1 475.8 Q122.2 470.7 132.2 481.6 Q142.3 492.4 152.3 487.3 Q162.4 482.2 172.4 493.1 Q182.5 504 192.6 498.9 Q202.6 493.8 212.7 504.7 Q222.7 515.6 232.8 510.4 Q242.8 505.3 252.9 516.2 Q262.9 527.1 273 522" marker-end="url(#air-arrow)"/>
    <path id="lower-airflow" d="M91 567 Q100.9 577.9 110.9 572.8 Q120.8 567.7 130.8 578.6 Q140.7 589.4 150.7 584.3 Q160.6 579.2 170.6 590.1 Q180.5 601 190.4 595.9 Q200.4 590.8 210.3 601.7 Q220.3 612.6 230.2 607.4 Q240.2 602.3 250.1 613.2 Q260.1 624.1 270 619" marker-end="url(#air-arrow)"/>
  </g>
  <path id="single-baffle" d="M247.27,572.84l-143.58,101.05c-2.63-16.65-4.64-35.59-5.19-56.45-.61-22.88-1.3-43.46,3.75-69.7,3.97-20.63,9.68-35.6,18.99-60.02,3.96-10.38,9.78-25.52,19.03-44.35,17.41-35.46,36.15-61.94,48.23-77.65,20.06-26.08,38.21-43.83,48.38-53.71,10.53-10.22,20.76-19.59,27.92-25.65l-17.53,286.49Z" fill="#40C1AC" stroke="#123E38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" mask="url(#baffle-vent-mask)"/>
  <g fill="none" stroke="#123E38" stroke-width="1.6" aria-hidden="true">
    <ellipse cx="215" cy="405" rx="32.71851248" ry="46.27096409"/>
    <ellipse cx="180" cy="495" rx="32.71851248" ry="46.27096409"/>
    <ellipse cx="142" cy="585" rx="32.71851248" ry="46.27096409"/>
  </g>
  <!-- Restore the short visible stretches between each hole and the right edge, marked in the review. -->
  <g clip-path="url(#airflow-exit-bridges)" fill="none" stroke="#1F6D79" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity=".9" aria-hidden="true">
    <path d="M94 383 Q103.9 393.3 113.8 387.7 Q123.7 382 133.6 392.3 Q143.4 402.7 153.3 397 Q163.2 391.3 173.1 401.7 Q183 412 192.9 406.3 Q202.8 400.7 212.7 411 Q222.6 421.3 232.4 415.7 Q242.3 410 252.2 420.3 Q262.1 430.7 272 425"/>
