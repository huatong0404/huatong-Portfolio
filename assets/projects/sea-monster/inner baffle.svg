        stroke-linejoin: round;
      }

      .cls-2 {
        stroke: #000e07;
      }

      .cls-2, .cls-3 {
        fill: #67bfac;
        opacity: .2;
      }

      .cls-3 {
        stroke: #211815;
      }

      #middle-baffle {
        fill: #40C1AC;
        stroke: #123E38;
        stroke-width: 2;
        opacity: .86;
      }
    </style>
